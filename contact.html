<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Param Kalita | Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="logo" href="index.html">My Resume</a
        ><button class="menu-btn" aria-label="Toggle menu">☰</button>
        <div class="nav-links">
          <a href="index.html">Home</a><a href="resume.html">Resume</a
          ><a href="bio-data.html">Bio-data</a
          ><a class="active" href="contact.html">Contact</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-banner"><h1>Contact</h1></section>
      <section class="section">
        <div class="contact-grid">
          <div class="card">
            <h2>Contact Details</h2>
            <div class="contact-row">
              <span>Email</span
              ><strong
                ><a href="mailto:kalitaparam@gmail.com"
                  >kalitaparam@gmail.com</a
                ></strong
              >
            </div>
            <div class="contact-row">
              <span>Phone</span
              ><strong><a href="tel:+918473856011">+91 8473856011</a></strong>
            </div>
            <div class="contact-row">
              <span>Location</span
              ><strong>JP Nagar (8th Phase), Bengaluru, Karnataka</strong>
            </div>
            <div class="contact-row">
              <span>LinkedIn</span
              ><strong
                ><a
                  href="https://www.linkedin.com/in/param-kalita-2809b3328"
                  target="_blank"
                  >linkedin.com/in/param-kalita-2809b3328</a
                ></strong
              >
            </div>
            <div class="contact-row">
              <span>GitHub</span
              ><strong
                ><a href="https://github.com/Param-Anand-Kalita" target="_blank"
                  >github.com/Param-Anand-Kalita</a
                ></strong
              >
            </div>
          </div>
          <div class="card">
            <h2>Message</h2>
            <form id="contactForm">
              <label for="name">Name</label
              ><input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
              /><small class="error" id="nameError"></small
              ><label for="email">Email</label
              ><input
                type="email"
                id="email"
                name="email"
                placeholder="Your email"
                required
              /><small class="error" id="emailError"></small
              ><label for="message">Message</label
              ><textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Your message"
                required
              ></textarea
              ><small class="error" id="messageError"></small
              ><button type="submit" class="btn primary">Send Message</button>
              <p id="successMessage" class="success"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer>Param Kalita | Resume Website | <span id="year"></span></footer>
    <script src="script.js"></script>
  </body>
</html>
